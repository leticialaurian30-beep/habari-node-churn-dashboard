<!DOCTYPE html>
<html>
<head>
    <title>Login - Churn Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 80px auto; padding: 20px; }
        h1 { color: #1e293b; font-size: 24px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { margin-top: 20px; padding: 10px 20px; background: #e2231a; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #b91c1c; }
        .error { color: #721c24; background: #f8d7da; padding: 10px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Staff Login — Habari Node Churn Dashboard</h1>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</body>
</html>
